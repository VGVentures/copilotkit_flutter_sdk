name: main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      copilotkit: ${{ steps.filter.outputs.copilotkit }}
      copilotkit_flutter: ${{ steps.filter.outputs.copilotkit_flutter }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🔍 Detect changed packages
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/main.yaml
              - .fvmrc
              - pubspec.yaml
              - pubspec.lock
            copilotkit:
              - *shared
              - packages/copilotkit/**
            copilotkit_flutter:
              - *shared
              - packages/copilotkit/**
              - packages/copilotkit_flutter/**
            example:
              - *shared
              - packages/**
              - example/**

  copilotkit:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1.21.1
    with:
      working_directory: packages/copilotkit
      flutter_version_file: .fvmrc
      min_coverage: 100
      coverage_excludes: '**/*.g.dart'
      run_bloc_lint: false

  copilotkit_pure_dart:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Check copilotkit Has No Flutter Dependency
        working-directory: packages/copilotkit
        run: |
          if grep -rn "package:flutter" lib bin 2>/dev/null ||
            grep -nE "^\s+(flutter|flutter_test):" pubspec.yaml; then
            echo "copilotkit must not depend on Flutter"
            exit 1
          fi

  copilotkit_flutter:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit_flutter == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1.21.1
    with:
      working_directory: packages/copilotkit_flutter
      flutter_version_file: .fvmrc
      min_coverage: 100

  example:
    needs: changes
    if: ${{ needs.changes.outputs.example == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1.21.1
    with:
      working_directory: example
      flutter_version_file: .fvmrc
      min_coverage: 100
      coverage_excludes: '**/*.g.dart'

  codegen:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit == 'true' || needs.changes.outputs.example == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Generate Code (copilotkit)
        working-directory: packages/copilotkit
        run: dart run build_runner build

      - name: 🏗️ Generate Code (example)
        working-directory: example
        run: dart run build_runner build

      - name: 🔍 Check Generated Code Is Up To Date
        run: |
          git status --porcelain
          git diff
          test -z "$(git status --porcelain)"
