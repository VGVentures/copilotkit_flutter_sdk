name: main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      copilotkit: ${{ steps.filter.outputs.copilotkit }}
      copilotkit_flutter: ${{ steps.filter.outputs.copilotkit_flutter }}
      example: ${{ steps.filter.outputs.example }}
      json_utils: ${{ steps.filter.outputs.json_utils }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Detect changed packages
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/main.yaml
              - .fvmrc
              - pubspec.yaml
              - pubspec.lock
            copilotkit:
              - *shared
              - packages/json_utils/**
              - packages/copilotkit/**
            copilotkit_flutter:
              - *shared
              - packages/json_utils/**
              - packages/copilotkit/**
              - packages/copilotkit_flutter/**
            example:
              - *shared
              - packages/**
              - example/**
            json_utils:
              - *shared
              - packages/json_utils/**

  copilotkit:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      working_directory: packages/copilotkit
      flutter_version_file: .fvmrc
      min_coverage: 100
      coverage_excludes: '**/*.g.dart'

  copilotkit_flutter:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit_flutter == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      working_directory: packages/copilotkit_flutter
      flutter_version_file: .fvmrc
      min_coverage: 100

  example:
    needs: changes
    if: ${{ needs.changes.outputs.example == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      working_directory: example
      flutter_version_file: .fvmrc
      min_coverage: 100
      coverage_excludes: '**/*.g.dart'

  json_utils:
    needs: changes
    if: ${{ needs.changes.outputs.json_utils == 'true' }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@bf86fc749b907c6cc60e655f7f2ef619287b1b15 # v2.0.3
    with:
      working_directory: packages/json_utils
      flutter_version_file: .fvmrc
      min_coverage: 100

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.json_utils == 'true' || needs.changes.outputs.copilotkit == 'true' || needs.changes.outputs.copilotkit_flutter == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 📝 Check Docs (json_utils)
        if: ${{ needs.changes.outputs.json_utils == 'true' }}
        working-directory: packages/json_utils
        run: |
          dart doc --validate-links -o "$RUNNER_TEMP/docs/json_utils" 2>&1 | tee "$RUNNER_TEMP/json_utils.log"
          grep -q 'Found 0 warnings and 0 errors' "$RUNNER_TEMP/json_utils.log"

      - name: 📝 Check Docs (copilotkit)
        if: ${{ needs.changes.outputs.copilotkit == 'true' }}
        working-directory: packages/copilotkit
        run: |
          dart doc --validate-links -o "$RUNNER_TEMP/docs/copilotkit" 2>&1 | tee "$RUNNER_TEMP/copilotkit.log"
          grep -q 'Found 0 warnings and 0 errors' "$RUNNER_TEMP/copilotkit.log"

      - name: 📝 Check Docs (copilotkit_flutter)
        if: ${{ needs.changes.outputs.copilotkit_flutter == 'true' }}
        working-directory: packages/copilotkit_flutter
        run: |
          dart doc --validate-links -o "$RUNNER_TEMP/docs/copilotkit_flutter" 2>&1 | tee "$RUNNER_TEMP/copilotkit_flutter.log"
          grep -q 'Found 0 warnings and 0 errors' "$RUNNER_TEMP/copilotkit_flutter.log"

  web:
    needs: changes
    if: ${{ needs.changes.outputs.example == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Build Web (WebAssembly)
        working-directory: example
        run: flutter build web --wasm --dart-define=RUNTIME_URL=http://localhost:8200/api/copilotkit

  codegen:
    needs: changes
    if: ${{ needs.changes.outputs.copilotkit == 'true' || needs.changes.outputs.example == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Generate Code (copilotkit)
        working-directory: packages/copilotkit
        run: dart run build_runner build

      - name: 🏗️ Generate Code (example)
        working-directory: example
        run: dart run build_runner build

      - name: 🔍 Check Generated Code Is Up To Date
        run: |
          git status --porcelain
          git diff
          test -z "$(git status --porcelain)"
