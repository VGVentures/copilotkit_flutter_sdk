name: Coverage summary
description: >-
  Reports the line coverage of an lcov artifact in the job summary and as an
  annotation. Never fails: coverage is reported, not enforced.

inputs:
  package:
    description: Package name shown in the report.
    required: true
  artifact_name:
    description: Name of the artifact holding lcov.info.
    required: true

runs:
  using: composite
  steps:
    - name: 📥 Download coverage
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
        path: coverage

    - name: 📊 Report coverage
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        read -r hit found < <(awk -F: '/^LH:/{h+=$2} /^LF:/{f+=$2} END{print h+0, f+0}' coverage/lcov.info)
        if [ "$found" -eq 0 ]; then
          pct="n/a"
        else
          pct=$(awk -v h="$hit" -v f="$found" 'BEGIN{printf "%.2f%%", 100*h/f}')
        fi
        echo "### $PACKAGE coverage: $pct ($hit/$found lines)" >> "$GITHUB_STEP_SUMMARY"
        if [ "$hit" -eq "$found" ]; then
          echo "::notice title=$PACKAGE coverage::$pct ($hit/$found lines)"
        else
          echo "::warning title=$PACKAGE coverage::$pct ($hit/$found lines), below the 100% target"
        fi
